<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin — Machi-Board</title>
    <style>
      :root {
        --bg: #f6f5f2;
        --ink: #1c1b18;
        --muted: #6b675f;
        --accent: #0b6e4f;
        --accent-ink: #ffffff;
        --danger: #b3261e;
        --card: #ffffff;
        --line: #dcd9d2;
        --error-bg: #fdecea;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      .page {
        max-width: 32rem;
        margin: 0 auto;
        padding: 1.25rem 1.25rem 4rem;
      }
      header h1 {
        margin: 0.5rem 0 1.25rem;
        font-size: 1.5rem;
      }
      form {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        padding: 1.25rem;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 0 0 0.25rem;
      }
      input[type="password"] {
        width: 100%;
        font: inherit;
        font-size: 1rem;
        padding: 0.7rem 0.75rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 0.6rem 1rem;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
      }
      button[type="submit"],
      .primary {
        background: var(--accent);
        color: var(--accent-ink);
      }
      button[type="submit"] {
        width: 100%;
        margin-top: 1rem;
        padding: 0.95rem;
        font-size: 1.05rem;
      }
      .secondary {
        background: #ecebe7;
        color: var(--ink);
      }
      .danger {
        background: #fdecea;
        color: var(--danger);
      }
      .queue-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      .queue-head h2 {
        margin: 0;
        font-size: 1.3rem;
      }
      h3 {
        margin: 1.5rem 0 0.5rem;
        font-size: 1rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        padding: 1rem;
        margin-bottom: 0.75rem;
      }
      .card h4 {
        margin: 0 0 0.35rem;
        font-size: 1.05rem;
      }
      .card p {
        margin: 0.25rem 0;
      }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 600;
        background: #e7efe9;
        color: var(--accent);
        border-radius: 999px;
        padding: 0.1rem 0.6rem;
        margin-bottom: 0.4rem;
      }
      .meta {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .contacts {
        font-size: 0.9rem;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }
      .empty {
        color: var(--muted);
        font-style: italic;
      }
      .error {
        background: var(--error-bg);
        color: var(--danger);
        border-radius: 0.5rem;
        padding: 0.75rem;
        margin: 0 0 1rem;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <h1>Machi-Board Admin</h1>
      </header>

      <section id="login-section">
        <form id="login-form">
          <p id="login-error" class="error" role="alert" hidden></p>
          <label for="password">Passwort</label>
          <input id="password" type="password" required autocomplete="current-password" />
          <button type="submit">Anmelden</button>
        </form>
      </section>

      <section id="queue-section" hidden>
        <div class="queue-head">
          <h2>Moderation</h2>
          <button type="button" id="logout-btn" class="secondary">Abmelden</button>
        </div>
        <h3>Ausstehende Inserate</h3>
        <div id="pending-posts"></div>
        <h3>Ausstehende Kommentare</h3>
        <div id="pending-comments"></div>
        <h3>Live</h3>
        <div id="live-posts"></div>
      </section>
    </main>
    <script type="module">
      import { initAdminPage } from '/admin.js'
      initAdminPage()
    </script>
  </body>
</html>
