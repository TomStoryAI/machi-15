<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Machi-Board (Display)</title>
    <style>
      /* 55" TV display per Tom's sample board (spec 013): 3 rows x 9 columns of tiles.
         Empty tiles are QR codes, taken tiles show posts, the sponsor banner sits
         in the middle of the middle row. Large type, high contrast. */
      :root {
        --bg: #ffffff;
        --ink: #111111;
        --muted: #4a4a4a;
        --accent: #0b6e4f;
        --line: #d8d8d8;
        --card: #f7f7f5;
      }
      * {
        box-sizing: border-box;
      }
      html {
        font-size: 20px;
      }
      body {
        margin: 0;
        padding: 1.25rem 1.5rem;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.4;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 1rem;
      }
      header h1 {
        margin: 0;
        font-size: 2.2rem;
        letter-spacing: 0.01em;
      }
      .offline {
        margin: 0;
        font-size: 0.85rem;
        color: var(--muted);
        background: #fdf0d8;
        border-radius: 999px;
        padding: 0.3rem 1rem;
      }
      #grid {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 0.9rem;
        min-height: 0;
      }
      .tile,
      .frame,
      .sponsor {
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        background: var(--card);
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .tile {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem;
      }
      .tile-qr svg {
        width: 100%;
        max-width: 11rem;
        height: auto;
      }
      .frame {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        padding: 0.8rem 0.9rem;
      }
      .frame-title {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .frame-body {
        margin: 0;
        font-size: 0.95rem;
        overflow-wrap: anywhere;
        flex: 1;
      }
      .frame-photo {
        width: 100%;
        max-height: 9rem;
        object-fit: cover;
        border-radius: 0.5rem;
      }
      .contacts {
        margin: 0;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .frame-comments {
        align-self: flex-start;
        font-size: 0.75rem;
        font-weight: 600;
        background: #e7efe9;
        color: var(--accent);
        border-radius: 999px;
        padding: 0.1rem 0.6rem;
      }
      .frame-comment-list {
        margin: 0;
        padding: 0 0 0 1rem;
        list-style: disc;
      }
      .frame-comment-list li {
        font-size: 0.8rem;
        color: var(--muted);
        margin: 0.15rem 0;
        overflow-wrap: anywhere;
      }
      .frame-qr svg {
        width: 3.2rem;
        height: auto;
        display: block;
      }
      .sponsor {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        padding: 0.9rem;
        text-align: center;
      }
      .promoter-logo {
        max-width: 100%;
        max-height: 65%;
        object-fit: contain;
      }
      .promoter-name {
        font-size: 1.1rem;
        font-weight: 700;
      }
      .promoter-slogan {
        font-size: 0.9rem;
        color: var(--muted);
      }
      .legal {
        margin-top: 1rem;
        font-size: 0.7rem;
        color: var(--muted);
      }
      .legal a {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Machi-Board (Display)</h1>
      <p id="offline-hint" class="offline" hidden>Offline – zeige den letzten Stand.</p>
    </header>
    <main id="grid"></main>
    <footer class="legal">
      <a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a>
    </footer>
    <script type="module">
      import { initDisplayPage } from '/display.js'
      initDisplayPage()
    </script>
  </body>
</html>
